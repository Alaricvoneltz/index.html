<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You, Ay 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Load Google Gen AI SDK -->
<script type="importmap">
  {
    "imports": {
      "@google/genai": "https://esm.run/@google/genai"
    }
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    width: 100%; height: 100%;
    background: #0f172a; color: #f8fafc;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px; text-align: center; background: #0f172a; z-index: 10;
  }

  h1 { font-size: 24px; color: #f43f5e; margin-bottom: 8px; font-weight: 700; }
  p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }

  input, textarea {
    width: 100%; max-width: 320px;
    background: #1e293b; border: 1px solid #334155;
    color: #fff; padding: 12px 16px; border-radius: 12px;
    font-family: inherit; font-size: 14px; outline: none; margin-bottom: 12px;
    text-align: center;
  }

  .btn {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: white; border: none; padding: 12px 28px; border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4); width: 100%; max-width: 320px;
  }
  .btn:active { transform: scale(0.96); }

  #app-screen { display: none; justify-content: flex-start; padding: 16px; }
  
  .chat-container {
    width: 100%; max-width: 480px; height: 100%;
    margin: 0 auto; display: flex; flex-direction: column;
  }

  .header-card {
    background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.08);
    padding: 14px; border-radius: 16px; display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px; backdrop-filter: blur(8px);
  }
  .mascot-avatar {
    width: 45px; height: 45px; border-radius: 50%; background: #f43f5e;
    display: flex; justify-content: center; align-items: center; font-size: 22px;
    box-shadow: 0 0 12px rgba(244, 63, 94, 0.5);
  }
  .mascot-info h3 { font-size: 14px; color: #fff; }
  .mascot-info p { font-size: 11px; color: #38bdf8; margin: 0; text-align: left; }

  .chat-box {
    flex: 1; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 16px; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 12px;
  }

  .message {
    max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4;
  }
  .message.ai { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; }
  .message.user { background: #f43f5e; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

  .input-area {
    display: flex; gap: 8px;
  }
  .input-area input { margin: 0; text-align: left; flex: 1; }
  .btn-send {
    width: 50px; background: #f43f5e; border: none; border-radius: 12px;
    color: white; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center;
  }
</style>
</head>
<body>

  <!-- Screen 1: Password Login -->
  <div id="login-screen" class="screen">
    <h1>HALO AY 🌸</h1>
    <p>Masukkan tanggal lahir kamu untuk membuka ruang spesial ini (DDMMYYYY).</p>
    <input type="password" id="passInput" placeholder="Password (Contoh: 26092011)">
    <button class="btn" onclick="checkPassword()">MASUK</button>
  </div>

  <!-- Screen 2: Main Chat App -->
  <div id="app-screen" class="screen">
    <div class="chat-container">
      <div class="header-card">
        <div class="mascot-avatar">🐱</div>
        <div class="mascot-info">
          <h3>Asisten Pribadi Ay</h3>
          <p id="schedule-status">Menyesuaikan jadwal X BUS 1...</p>
        </div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan ke maskot..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

<script type="module">
  import { GoogleGenAI } from "@google/genai";

  // Masukkan API Key berformat AQ kamu di sini
  const apiKey = "AQ.Ab8RN6LB6qm4ut6n5ZyRp27SPLvlAPv04ipPSwdFOP3p-bB1qw";
  const ai = new GoogleGenAI({ apiKey: apiKey });

  const systemInstruction = `Kamu adalah maskot virtual yang imut, manis, dan sangat perhatian. Panggil pengguna dengan sebutan "Ay". 
  Dia adalah Wafina Septianingsih (lahir 26 September 2011), seorang siswi kelas X BUS 1 di SMKN 1 Kendal, Jawa Tengah.
  PENTING: Dia tidak naik sepeda motor, melainkan berangkat dan pulang sekolah menggunakan BRT (Bus Rapid Transit). 
  Sesuaikan obrolan dengan jadwal sekolahnya (Dasar-dasar Busana, Koding dan KA, Sejarah, dll.) dan ingatkan soal keselamatannya saat naik BRT. Jawab dengan ramah dan natural seperti sahabat/pacar yang peduli.`;

  let chatSession;

  window.checkPassword = function() {
    const val = document.getElementById('passInput').value;
    if (val === '26092011') {
      document.getElementById('login-screen').style.display = 'none';
      startApp();
    } else {
      alert('Password salah, Ay! Coba ingat tanggal lahirmu (26092011).');
    }
  }

  async function startApp() {
    document.getElementById('app-screen').style.display = 'flex';
    
    try {
      // Inisialisasi chat dengan SDK resmi yang mendukung token AQ
      chatSession = ai.chats.create({
        model: 'gemini-2.5-flash',
        config: {
          systemInstruction: systemInstruction,
        }
      });
      checkScheduleAndGreet();
    } catch (err) {
      appendMessage("Gagal menginisialisasi AI: " + err.message, 'ai');
    }
  }

  async function checkScheduleAndGreet() {
    const now = new Date();
    const hour = now.getHours();

    let greeting = "Good morning, Ay! Gimana mimpinya tadi malem? Semoga indah ya, atau malah mimpi buruk? Cerita yuk!";
    if (hour >= 11 && hour < 15) greeting = "Halo Ay! Udah siang nih, gimana pelajarannya di SMKN 1 Kendal? Jangan lupa istirahat ya.";
    else if (hour >= 15) greeting = "Yeay, waktunya pulang! Hati-hati di jalan ya Ay, jangan lupa naik BRT-nya dengan aman ya.";

    document.getElementById('schedule-status').innerText = "SMKN 1 Kendal • Kelas X BUS 1";
    appendMessage(greeting, 'ai');
  }

  function appendMessage(text, sender) {
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  window.sendMessage = async function() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || !chatSession) return;

    appendMessage(text, 'user');
    input.value = '';

    try {
      const result = await chatSession.sendMessage({ message: text });
      const reply = result.text;
      appendMessage(reply, 'ai');
    } catch (err) {
      appendMessage("Error: " + err.message, 'ai');
    }
  }
</script>
</body>
</html>
