<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cyber Tap Reflex</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }

  .game-card {
    width: 100%;
    max-width: 420px;
    background: rgba(24, 24, 27, 0.85);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(139, 92, 246, 0.2);
    text-align: center;
    backdrop-filter: blur(10px);
  }

  h1 {
    font-size: 22px;
    color: #a855f7;
    text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: #09090b;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid #27272a;
  }

  .stat-box { font-size: 13px; color: #a1a1aa; }
  .stat-val { font-size: 18px; font-weight: 700; color: #38bdf8; display: block; }

  #game-board {
    width: 100%;
    height: 320px;
    background: #0d0e15;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    border: 2px dashed rgba(168, 85, 247, 0.3);
  }

  #target {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle, #f43f5e 0%, #be123c 100%);
    box-shadow: 0 0 20px #f43f5e;
    position: absolute;
    display: none;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn {
    background: linear-gradient(135deg, #8b5cf6, #6366f1);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    transition: 0.2s;
  }

  .btn:active { transform: scale(0.97); }

  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(9, 9, 11, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 14px;
  }

  #overlay h2 { font-size: 20px; color: #38bdf8; margin-bottom: 6px; }
  #overlay p { font-size: 13px; color: #a1a1aa; }
</style>
</head>
<body>

<div class="game-card">
  <h1>⚡ CYBER REFLEX</h1>
  
  <div class="stats-bar">
    <div class="stat-box">Skor<span id="score" class="stat-val">0</span></div>
    <div class="stat-box">Waktu<span id="timer" class="stat-val">20s</span></div>
    <div class="stat-box">Rekor<span id="highscore" class="stat-val">0</span></div>
  </div>

  <div id="game-board">
    <div id="target"></div>
    <div id="overlay">
      <h2>SIAP MAIN?</h2>
      <p>Tekan target secepat mungkin!</p>
    </div>
  </div>

  <button class="btn" id="start-btn" onclick="startGame()">MULAI GAME</button>
</div>

<script>
  let score = 0;
  let timeLeft = 20;
  let gameTimer = null;
  let highScore = localStorage.getItem('cyber_reflex_hs') || 0;
  
  const target = document.getElementById('target');
  const board = document.getElementById('game-board');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const hsEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');

  hsEl.innerText = highScore;

  function moveTarget() {
    const maxX = board.clientWidth - 60;
    const maxY = board.clientHeight - 60;
    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);
    
    target.style.left = randomX + 'px';
    target.style.top = randomY + 'px';
  }

  function hitTarget() {
    score++;
    scoreEl.innerText = score;
    moveTarget();
  }

  target.addEventListener('touchstart', (e) => {
    e.preventDefault();
    hitTarget();
  });
  target.addEventListener('click', hitTarget);

  function startGame() {
    score = 0;
    timeLeft = 20;
    scoreEl.innerText = score;
    timerEl.innerText = timeLeft + 's';
    
    overlay.style.display = 'none';
    target.style.display = 'block';
    startBtn.style.display = 'none';
    
    moveTarget();

    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
      timeLeft--;
      timerEl.innerText = timeLeft + 's';

      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    clearInterval(gameTimer);
    target.style.display = 'none';
    overlay.style.display = 'flex';
    startBtn.style.display = 'block';
    startBtn.innerText = 'MAIN LAGI';

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('cyber_reflex_hs', highScore);
      hsEl.innerText = highScore;
      overlay.innerHTML = `<h2>🎉 REKOR BARU!</h2><p>Skor Akhir Kamu: <b>${score}</b></p>`;
    } else {
      overlay.innerHTML = `<h2>WAKTU HABIS!</h2><p>Skor Kamu: <b>${score}</b></p>`;
    }
  }
</script>

</body>
</html>
