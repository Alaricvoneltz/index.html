<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seblak & Fruit Slicer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html {
    width: 100%; height: 100%;
    background: #090d16; color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  #game-container {
    position: relative; width: 100%; height: 100%;
    max-width: 480px; margin: 0 auto;
    background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
    box-shadow: 0 0 40px rgba(244, 63, 94, 0.25);
  }

  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* UI HUD */
  .hud {
    position: absolute; top: 16px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 10;
  }
  .stat-box {
    background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(244, 63, 94, 0.3);
    padding: 6px 14px; border-radius: 12px; backdrop-filter: blur(6px);
  }
  .stat-label { font-size: 10px; color: #fda4af; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 900; color: #fbbf24; }

  /* Overlay UI */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(9, 13, 22, 0.9);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px; text-align: center; z-index: 20; backdrop-filter: blur(8px);
  }

  h1 { font-size: 28px; font-weight: 900; color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.6); margin-bottom: 6px; }
  p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }

  .btn-play {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: white; font-family: inherit; font-size: 16px; font-weight: 900;
    border: none; padding: 14px 32px; border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(244, 63, 94, 0.5); transition: 0.2s;
  }
  .btn-play:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <!-- HUD BAR -->
  <div class="hud">
    <div class="stat-box">
      <div class="stat-label">SKOR</div>
      <div id="score-val" class="stat-value">0</div>
    </div>
    <div class="stat-box" style="text-align: right;">
      <div class="stat-label">NYAWA</div>
      <div id="lives-val" class="stat-value" style="font-size:16px;">❤️❤️❤️</div>
    </div>
  </div>

  <!-- START OVERLAY -->
  <div id="start-screen" class="overlay">
    <h1>SEBLAK SLICER ⚔️</h1>
    <p>Tebas 🍲 Seblak, 🍉 Semangka, 🥭 Mangga & 🧋 Es Teh!<br><b>HINDARI BOM 💣 & JANGAN BIARKAN JATUH!</b></p>
    <button class="btn-play" onclick="startGame()">MULAI TEBAS</button>
  </div>

  <!-- GAMEOVER OVERLAY -->
  <div id="gameover-screen" class="overlay" style="display:none;">
    <h1 style="color:#ef4444;">GAME OVER 💥</h1>
    <p>Skor Akhir Kamu: <b id="final-score" style="color:#fbbf24; font-size:18px;">0</b><br>Rekor Tertinggi: <b id="high-score" style="color:#38bdf8;">0</b></p>
    <button class="btn-play" onclick="startGame()">MAIN LAGI</button>
  </div>
</div>

<script>
  // Web Audio Synth SFX
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }

  function playSound(type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'slice') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'bomb') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }
  }

  // Setup Canvas
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('game-container');

  function resize() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Daftar Item Kuliner
  const ITEM_TYPES = [
    { icon: '🍲', name: 'Seblak', pts: 10, color: '#f43f5e' },
    { icon: '🍉', name: 'Semangka', pts: 15, color: '#22c55e' },
    { icon: '🥭', name: 'Mangga', pts: 15, color: '#eab308' },
    { icon: '🧋', name: 'Es Teh', pts: 10, color: '#d97706' },
    { icon: '🌶️', name: 'Cabai', pts: 25, color: '#ef4444' },
    { icon: '💣', name: 'Bom', pts: 0, isBomb: true }
  ];

  // Game Variables
  let isPlaying = false;
  let score = 0;
  let lives = 3;
  let highScore = localStorage.getItem('seblak_slice_hs') || 0;
  let items = [];
  let particles = [];
  let slicedHalves = [];
  let swipePath = [];
  let spawnTimer = 0;

  // Touch & Mouse Input Tracking
  let isSwiping = false;

  function addSwipePoint(x, y) {
    const rect = canvas.getBoundingClientRect();
    const ptX = x - rect.left;
    const ptY = y - rect.top;
    swipePath.push({ x: ptX, y: ptY, time: Date.now() });
    checkSlices(ptX, ptY);
  }

  window.addEventListener('touchstart', (e) => { isSwiping = true; addSwipePoint(e.touches[0].clientX, e.touches[0].clientY); });
  window.addEventListener('touchmove', (e) => { if (isSwiping) addSwipePoint(e.touches[0].clientX, e.touches[0].clientY); });
  window.addEventListener('touchend', () => { isSwiping = false; });

  window.addEventListener('mousedown', (e) => { isSwiping = true; addSwipePoint(e.clientX, e.clientY); });
  window.addEventListener('mousemove', (e) => { if (isSwiping) addSwipePoint(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { isSwiping = false; });

  function spawnItems() {
    const count = Math.floor(Math.random() * 2) + 1;
    for (let i = 0; i < count; i++) {
      const type = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
      items.push({
        x: Math.random() * (canvas.width - 80) + 40,
        y: canvas.height + 40,
        vx: (Math.random() - 0.5) * 4,
        vy: -(Math.random() * 3 + 11),
        gravity: 0.28,
        radius: 30,
        rotation: 0,
        vRot: (Math.random() - 0.5) * 0.1,
        sliced: false,
        type: type
      });
    }
  }

  function checkSlices(x, y) {
    if (!isPlaying) return;
    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      if (item.sliced) continue;

      const dist = Math.hypot(item.x - x, item.y - y);
      if (dist < item.radius + 15) {
        item.sliced = true;
        
        if (item.type.isBomb) {
          playSound('bomb');
          createExplosion(item.x, item.y, '#ef4444', 30);
          endGame();
          return;
        }

        playSound('slice');
        score += item.type.pts;
        document.getElementById('score-val').innerText = score;

        // Buat Efek Cipratan & Potongan 2 Bagian
        createSplatter(item.x, item.y, item.type.color);
        createHalves(item);
        items.splice(i, 1);
      }
    }
  }

  function createHalves(item) {
    slicedHalves.push({
      x: item.x - 10, y: item.y, vx: item.vx - 3, vy: item.vy - 1,
      gravity: item.gravity, icon: item.type.icon, rotation: item.rotation, vRot: -0.15
    });
    slicedHalves.push({
      x: item.x + 10, y: item.y, vx: item.vx + 3, vy: item.vy - 1,
      gravity: item.gravity, icon: item.type.icon, rotation: item.rotation, vRot: 0.15
    });
  }

  function createSplatter(x, y, color) {
    for (let i = 0; i < 15; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        radius: Math.random() * 5 + 3,
        color: color,
        life: 20
      });
    }
  }

  function createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 12,
        vy: (Math.random() - 0.5) * 12,
        radius: Math.random() * 8 + 4,
        color: color,
        life: 30
      });
    }
  }

  function update() {
    if (!isPlaying) return;

    // Timer Spawn Makanan
    spawnTimer++;
    if (spawnTimer % 65 === 0) spawnItems();

    // Clean Trail
    const now = Date.now();
    swipePath = swipePath.filter(pt => now - pt.time < 150);

    // Update Items
    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.x += item.vx;
      item.y += item.vy;
      item.vy += item.gravity;
      item.rotation += item.vRot;

      // Hukuman jika makanan luput jatuh (Bukan Bom)
      if (item.y > canvas.height + 60) {
        if (!item.type.isBomb) {
          lives--;
          updateLivesUI();
          if (lives <= 0) endGame();
        }
        items.splice(i, 1);
      }
    }

    // Update Sliced Halves
    for (let i = slicedHalves.length - 1; i >= 0; i--) {
      let h = slicedHalves[i];
      h.x += h.vx; h.y += h.vy; h.vy += h.gravity; h.rotation += h.vRot;
      if (h.y > canvas.height + 60) slicedHalves.splice(i, 1);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Items
    items.forEach(item => {
      ctx.save();
      ctx.translate(item.x, item.y);
      ctx.rotate(item.rotation);
      ctx.font = '42px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.type.icon, 0, 0);
      ctx.restore();
    });

    // Draw Sliced Halves
    slicedHalves.forEach(h => {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rotation);
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(h.icon, 0, 0);
      ctx.restore();
    });

    // Draw Particles
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // Draw Neon Swipe Blade Trail
    if (swipePath.length > 1) {
      ctx.beginPath();
      ctx.moveTo(swipePath[0].x, swipePath[0].y);
      for (let i = 1; i < swipePath.length; i++) {
        ctx.lineTo(swipePath[i].x, swipePath[i].y);
      }
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#f43f5e';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function loop() {
    update();
    draw();
    if (isPlaying) requestAnimationFrame(loop);
  }

  function updateLivesUI() {
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '❤️';
    document.getElementById('lives-val').innerText = hearts || '💀';
  }

  function startGame() {
    initAudio();
    score = 0; lives = 3; items = []; particles = []; slicedHalves = []; swipePath = [];
    document.getElementById('score-val').innerText = '0';
    updateLivesUI();

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('gameover-screen').style.display = 'none';

    isPlaying = true;
    loop();
  }

  function endGame() {
    isPlaying = false;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('seblak_slice_hs', highScore);
    }
    document.getElementById('final-score').innerText = score;
    document.getElementById('high-score').innerText = highScore;
    document.getElementById('gameover-screen').style.display = 'flex';
  }
</script>

</body>
</html>
