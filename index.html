<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Mosaic Generator 🧩</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc;
    margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
  }
  .container {
    background: #1e293b; padding: 24px; border-radius: 16px; width: 100%;
    max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155;
  }
  h1 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 24px; font-size: 24px; }
  .upload-group {
    margin-bottom: 20px; background: #0f172a; padding: 16px;
    border-radius: 12px; border: 1px dashed #475569;
  }
  label { display: block; margin-bottom: 8px; font-weight: 600; color: #94a3b8; font-size: 14px; }
  input[type="file"] { color: #cbd5e1; width: 100%; font-size: 13px; }
  
  .btn {
    background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; border: none;
    padding: 14px; border-radius: 12px; width: 100%; font-weight: 700; font-size: 15px;
    cursor: pointer; transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  
  #status { text-align: center; margin-top: 14px; color: #fbbf24; font-weight: 600; font-size: 14px; min-height: 20px; }
  
  .canvas-container {
    margin-top: 20px; width: 100%; overflow-x: auto; background: #000;
    border-radius: 12px; display: flex; justify-content: center; align-items: center;
    border: 1px solid #334155;
  }
  canvas { max-width: 100%; height: auto; border-radius: 8px; }
</style>
</head>
<body>
  <div class="container">
    <h1>Mosaik Foto Generator 🧩</h1>
    
    <div class="upload-group">
      <label>1. Upload Gambar Utama (Target seperti wajah Pak Jokowi)</label>
      <input type="file" id="targetUpload" accept="image/*">
    </div>
    
    <div class="upload-group">
      <label>2. Upload Gambar Random (Pilih minimal 10-30 foto sekaligus)</label>
      <input type="file" id="sourceUpload" accept="image/*" multiple>
    </div>

    <button class="btn" onclick="generateMosaic()">Buat Mosaik Sekarang!</button>
    <div id="status">Menunggu gambar...</div>
    
    <div class="canvas-container">
      <canvas id="mosaicCanvas"></canvas>
    </div>
  </div>

  <script>
  const targetUpload = document.getElementById('targetUpload');
  const sourceUpload = document.getElementById('sourceUpload');
  const canvas = document.getElementById('mosaicCanvas');
  const ctx = canvas.getContext('2d');
  const statusDiv = document.getElementById('status');

  let targetImg = null;
  let sourceImages = [];
  const TILE_SIZE = 15; // Ukuran kotak per gambar kecil (makin kecil makin detail tapi agak berat)
  const COLUMNS = 60; // Jumlah kotak ke samping

  // 1. Membaca gambar target utama
  targetUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => { targetImg = img; statusDiv.innerText = "Gambar utama berhasil dimuat!"; };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 2. Membaca gambar-gambar random dan menghitung warna rata-ratanya
  sourceUpload.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    statusDiv.innerText = `Memproses ${files.length} gambar random...`;
    sourceImages = [];
    
    for (let file of files) {
      const img = await loadImage(file);
      const color = getAverageColor(img);
      sourceImages.push({ img, color });
    }
    statusDiv.innerText = `${sourceImages.length} gambar random siap digunakan!`;
  });

  function loadImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function getAverageColor(img) {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = TILE_SIZE; tempCanvas.height = TILE_SIZE;
    tempCtx.drawImage(img, 0, 0, TILE_SIZE, TILE_SIZE);
    const data = tempCtx.getImageData(0, 0, TILE_SIZE, TILE_SIZE).data;
    
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < data.length; i += 4) {
      r += data[i]; g += data[i+1]; b += data[i+2];
    }
    const count = data.length / 4;
    return { r: Math.round(r/count), g: Math.round(g/count), b: Math.round(b/count) };
  }

  // 3. Mencari gambar random yang warnanya paling pas
  function findBestMatch(targetColor) {
    let bestMatch = sourceImages[0];
    let minDiff = Infinity;
    for (let src of sourceImages) {
      // Rumus menghitung selisih warna
      const diff = Math.abs(src.color.r - targetColor.r) + 
                   Math.abs(src.color.g - targetColor.g) + 
                   Math.abs(src.color.b - targetColor.b);
      if (diff < minDiff) {
        minDiff = diff;
        bestMatch = src;
      }
    }
    return bestMatch;
  }

  // 4. Proses menggambar dan menyatukan mosaik
  async function generateMosaic() {
    if (!targetImg) return alert("Pilih gambar utamanya dulu ya!");
    if (sourceImages.length === 0) return alert("Upload minimal 10-30 gambar random biar mosaiknya kelihatan bagus!");
    
    statusDiv.innerText = "Sedang menyusun gambar... Sabar ya Kiki!";
    
    // Setup ukuran kanvas akhir
    const width = COLUMNS * TILE_SIZE;
    const scale = width / targetImg.width;
    const height = Math.floor(targetImg.height * scale);
    const rows = Math.floor(height / TILE_SIZE);
    
    canvas.width = width; canvas.height = height;

    // Baca pixel dari gambar utama
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = COLUMNS; tempCanvas.height = rows;
    tempCtx.drawImage(targetImg, 0, 0, COLUMNS, rows);
    const targetData = tempCtx.getImageData(0, 0, COLUMNS, rows).data;

    let pixelIndex = 0;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < COLUMNS; x++) {
        const r = targetData[pixelIndex];
        const g = targetData[pixelIndex + 1];
        const b = targetData[pixelIndex + 2];
        
        const bestImage = findBestMatch({ r, g, b });
        // Gambar foto kecil di posisinya
        ctx.drawImage(bestImage.img, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        
        // Sedikit filter warna asli di atasnya agar lebih menyatu dan jelas bentuknya
        ctx.fillStyle = `rgba(${r},${g},${b}, 0.4)`;
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        
        pixelIndex += 4;
      }
      // Delay sedikit per baris supaya browser HP tidak force close/nge-hang
      await new Promise(r => setTimeout(r, 5)); 
    }
    statusDiv.innerText = "Selesai! Gambar berhasil tersusun 🎉";
  }
</script>
</body>
</html>
