<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Photo Mosaic 🧩</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: #f8fafc; min-height: 100vh; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .container {
    background: rgba(30, 41, 59, 0.7); padding: 24px; border-radius: 20px;
    width: 100%; max-width: 600px; backdrop-filter: blur(12px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
  }
  h1 { text-align: center; color: #38bdf8; margin-bottom: 24px; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  
  .card {
    background: rgba(15, 23, 42, 0.6); padding: 16px; border-radius: 16px;
    border: 1px dashed rgba(148, 163, 184, 0.4); margin-bottom: 16px;
  }
  .card-title { font-weight: 600; color: #cbd5e1; font-size: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;}
  
  input[type="file"] { display: none; }
  .file-btn {
    background: #334155; color: #f8fafc; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: background 0.2s; border: 1px solid #475569; width: 100%; justify-content: center;
  }
  .file-btn:active { transform: scale(0.98); }
  
  /* Preview Image Styling */
  #targetPreview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; margin-top: 12px; display: none; background: #000; }
  .thumb-container { display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-bottom: 8px; }
  .thumb-container::-webkit-scrollbar { height: 6px; }
  .thumb-container::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid #38bdf8; flex-shrink: 0; }

  /* Settings Styling */
  .setting-group { margin-top: 12px; }
  input[type="range"] { width: 100%; margin-top: 8px; accent-color: #38bdf8; }

  .action-btn {
    background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; border: none;
    padding: 14px; border-radius: 14px; width: 100%; font-weight: 700; font-size: 15px;
    cursor: pointer; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); margin-top: 8px;
    display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform 0.2s;
  }
  .action-btn:active { transform: scale(0.97); }
  
  .download-btn {
    background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
    display: none; margin-top: 12px;
  }

  #status { text-align: center; margin-top: 16px; color: #fbbf24; font-weight: 600; font-size: 13px; min-height: 20px; }
  
  .canvas-wrapper {
    margin-top: 20px; width: 100%; overflow: hidden; background: #000;
    border-radius: 12px; display: flex; justify-content: center; align-items: center;
    border: 1px solid #475569; position: relative;
  }
  canvas { max-width: 100%; height: auto; border-radius: 10px; display: block; }
</style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-border-all"></i> Pro Mosaic Generator</h1>
    
    <!-- Upload Gambar Utama -->
    <div class="card">
      <div class="card-title">1. Gambar Target (Utama)</div>
      <label class="file-btn">
        <i class="fa-solid fa-image"></i> Pilih Gambar Utama
        <input type="file" id="targetUpload" accept="image/*">
      </label>
      <img id="targetPreview" alt="Preview Utama">
    </div>
    
    <!-- Upload Gambar Random -->
    <div class="card">
      <div class="card-title">
        <span>2. Gambar Random (Mosaik)</span>
        <span id="sourceCount" style="color:#38bdf8; font-size:12px;">0 terpilih</span>
      </div>
      <label class="file-btn">
        <i class="fa-solid fa-images"></i> Pilih Banyak Gambar
        <input type="file" id="sourceUpload" accept="image/*" multiple>
      </label>
      <div class="thumb-container" id="thumbContainer"></div>
    </div>

    <!-- Pengaturan Ukuran -->
    <div class="card">
      <div class="card-title">3. Pengaturan Mosaik</div>
      <div class="setting-group">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #cbd5e1;">
          <span>Ukuran Potongan Gambar</span>
          <span id="tileSizeVal" style="font-weight:bold; color:#38bdf8;">25px</span>
        </div>
        <!-- Slider ukuran tile (10px paling detail, 60px paling besar) -->
        <input type="range" id="tileSizeInput" min="10" max="60" value="25">
      </div>
    </div>

    <button class="action-btn" id="generateBtn" onclick="generateMosaic()">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Buat Mosaik Sekarang!
    </button>
    
    <div id="status">Pilih gambar utama dan gambar random untuk memulai.</div>
    
    <div class="canvas-wrapper">
      <canvas id="mosaicCanvas"></canvas>
    </div>

    <button class="action-btn download-btn" id="downloadBtn" onclick="downloadMosaic()">
      <i class="fa-solid fa-download"></i> Unduh Hasil Mosaik
    </button>
  </div>

 <script>
  const targetUpload = document.getElementById('targetUpload');
  const targetPreview = document.getElementById('targetPreview');
  const sourceUpload = document.getElementById('sourceUpload');
  const thumbContainer = document.getElementById('thumbContainer');
  const sourceCount = document.getElementById('sourceCount');
  
  const tileSizeInput = document.getElementById('tileSizeInput');
  const tileSizeVal = document.getElementById('tileSizeVal');
  const canvas = document.getElementById('mosaicCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusDiv = document.getElementById('status');
  const downloadBtn = document.getElementById('downloadBtn');

  let targetImg = null;
  let sourceImages = [];

  // Update text slider ukuran
  tileSizeInput.addEventListener('input', (e) => {
    tileSizeVal.innerText = `${e.target.value}px`;
  });

  // 1. Membaca dan menampilkan Preview Gambar Utama
  targetUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => { 
        targetImg = img; 
        targetPreview.src = img.src;
        targetPreview.style.display = 'block';
        statusDiv.innerText = "Gambar utama dimuat. Lanjut pilih gambar random!";
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 2. Membaca dan menampilkan Thumbnail Gambar Random
  sourceUpload.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    
    statusDiv.innerText = `Memproses ${files.length} gambar random...`;
    sourceCount.innerText = `${files.length} terpilih`;
    thumbContainer.innerHTML = ''; // Kosongkan thumbnail sebelumnya
    sourceImages = [];
    
    for (let file of files) {
      const img = await loadImage(file);
      const color = getAverageColor(img);
      sourceImages.push({ img, color });
      
      // Buat thumbnail kecil di UI
      const thumb = document.createElement('img');
      thumb.src = img.src;
      thumb.className = 'thumb';
      thumbContainer.appendChild(thumb);
    }
    statusDiv.innerText = `${sourceImages.length} gambar siap disusun!`;
  });

  function loadImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function getAverageColor(img) {
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = 10; tempCanvas.height = 10;
    tempCtx.drawImage(img, 0, 0, 10, 10);
    const data = tempCtx.getImageData(0, 0, 10, 10).data;
    
    let r = 0, g = 0, b = 0;
    const count = data.length / 4;
    for (let i = 0; i < data.length; i += 4) {
      r += data[i]; g += data[i+1]; b += data[i+2];
    }
    return { r: Math.round(r/count), g: Math.round(g/count), b: Math.round(b/count) };
  }

  function findBestMatch(targetColor) {
    let bestMatch = sourceImages[0];
    let minDiff = Infinity;
    for (let src of sourceImages) {
      const diff = Math.abs(src.color.r - targetColor.r) + 
                   Math.abs(src.color.g - targetColor.g) + 
                   Math.abs(src.color.b - targetColor.b);
      if (diff < minDiff) {
        minDiff = diff;
        bestMatch = src;
      }
    }
    return bestMatch;
  }

  // 3. Render Mosaik
  async function generateMosaic() {
    if (!targetImg) return alert("Pilih gambar utamanya dulu ya!");
    if (sourceImages.length === 0) return alert("Upload beberapa gambar random dulu!");
    
    // Ambil ukuran dari slider (semakin besar angkanya, semakin besar potongan gambarnya)
    const TILE_SIZE = parseInt(tileSizeInput.value);
    
    // Tetapkan lebar patokan hasil akhir (misal 1000px agar cukup detail tapi tidak lemot)
    const outputWidth = 1000; 
    const COLUMNS = Math.floor(outputWidth / TILE_SIZE);
    
    statusDiv.innerText = "Merakit mosaik... Sabar ya Kiki!";
    downloadBtn.style.display = 'none'; // Sembunyikan tombol unduh saat proses
    
    const scale = outputWidth / targetImg.width;
    const outputHeight = Math.floor(targetImg.height * scale);
    const rows = Math.floor(outputHeight / TILE_SIZE);
    
    canvas.width = COLUMNS * TILE_SIZE; 
    canvas.height = rows * TILE_SIZE;

    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
    tempCanvas.width = COLUMNS; tempCanvas.height = rows;
    tempCtx.drawImage(targetImg, 0, 0, COLUMNS, rows);
    const targetData = tempCtx.getImageData(0, 0, COLUMNS, rows).data;

    let pixelIndex = 0;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < COLUMNS; x++) {
        const r = targetData[pixelIndex];
        const g = targetData[pixelIndex + 1];
        const b = targetData[pixelIndex + 2];
        
        const bestImage = findBestMatch({ r, g, b });
        
        // Gambar potongan kecilnya
        ctx.drawImage(bestImage.img, x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        
        // Overlay warna supaya wajah aslinya tetap mudah dikenali
        ctx.fillStyle = `rgba(${r},${g},${b}, 0.45)`;
        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        
        pixelIndex += 4;
      }
      // Animasi proses (mencegah HP lag/freeze)
      if (y % 5 === 0) await new Promise(r => setTimeout(r, 1)); 
    }
    
    statusDiv.innerHTML = "✨ Selesai! Mosaik berhasil tersusun. ✨";
    downloadBtn.style.display = 'flex'; // Munculkan tombol unduh
  }

  // 4. Fitur Unduh (Download) Hasil
  function downloadMosaic() {
    const dataURL = canvas.toDataURL("image/jpeg", 0.9);
    const link = document.createElement("a");
    link.href = dataURL;
    link.download = `Mosaik-Kiki-${new Date().getTime()}.jpg`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
</body>
</html>
