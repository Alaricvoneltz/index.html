<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Seblak & Kuliner Tap</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: radial-gradient(circle at center, #2e1065 0%, #09090b 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
  }

  .game-card {
    width: 100%;
    max-width: 420px;
    background: rgba(24, 24, 27, 0.9);
    border: 1px solid rgba(244, 63, 94, 0.3);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(244, 63, 94, 0.2);
    text-align: center;
    backdrop-filter: blur(10px);
  }

  h1 {
    font-size: 22px;
    color: #f43f5e;
    text-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
    margin-bottom: 4px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 12px;
    color: #fda4af;
    margin-bottom: 12px;
  }

  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: #09090b;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid #27272a;
  }

  .stat-box { font-size: 12px; color: #a1a1aa; }
  .stat-val { font-size: 18px; font-weight: 700; color: #fbbf24; display: block; }

  #game-board {
    width: 100%;
    height: 320px;
    background: #0d0e15;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    border: 2px dashed rgba(244, 63, 94, 0.4);
  }

  #target {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid #f43f5e;
    box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
    position: absolute;
    display: none;
    cursor: pointer;
    touch-action: manipulation;
    font-size: 34px;
    line-height: 60px;
    text-align: center;
    transition: transform 0.1s;
  }

  #target:active { transform: scale(0.85); }

  .btn {
    background: linear-gradient(135deg, #f43f5e, #e11d48);
    color: white;
    border: none;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    transition: 0.2s;
  }

  .btn:active { transform: scale(0.97); }

  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(9, 9, 11, 0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 14px;
    padding: 10px;
  }

  #overlay h2 { font-size: 20px; color: #fbbf24; margin-bottom: 6px; }
  #overlay p { font-size: 13px; color: #fda4af; }

  .food-label {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #fbbf24;
    font-weight: bold;
    background: rgba(0,0,0,0.6);
    padding: 3px 12px;
    border-radius: 10px;
    border: 1px solid rgba(251, 191, 36, 0.3);
  }
</style>
</head>
<body>

<div class="game-card">
  <h1>🍲 SEBLAK & KULINER TAP</h1>
  <div class="subtitle">Tangkap Makanan Pedas & Segar!</div>
  
  <div class="stats-bar">
    <div class="stat-box">Skor<span id="score" class="stat-val">0</span></div>
    <div class="stat-box">Waktu<span id="timer" class="stat-val">20s</span></div>
    <div class="stat-box">Rekor<span id="highscore" class="stat-val">0</span></div>
  </div>

  <div id="game-board">
    <div id="target">🍲</div>
    <div id="food-label" class="food-label" style="display:none;">Seblak Pedas</div>
    <div id="overlay">
      <h2>SIAP BERBURU KULINER?</h2>
      <p>Tap Seblak, Semangka & Jajanan Khas!</p>
    </div>
  </div>

  <button class="btn" id="start-btn" onclick="startGame()">MULAI BERBURU</button>
</div>

<script>
  // Daftar Makanan & Poinnya
  const foods = [
    { icon: '🍲', name: 'Seblak Pedas (+1)', pts: 1 },
    { icon: '🍉', name: 'Semangka Segar (+1)', pts: 1 },
    { icon: '🧋', name: 'Es Teh Manis (+1)', pts: 1 },
    { icon: '🍡', name: 'Bakso Colok (+1)', pts: 1 },
    { icon: '🍜', name: 'Mie Setan (+1)', pts: 1 },
    { icon: '🌶️', name: 'Cabe Rawit BONUS (+3)', pts: 3 }
  ];

  let score = 0;
  let timeLeft = 20;
  let gameTimer = null;
  let currentFood = foods[0];
  let highScore = localStorage.getItem('seblak_tap_hs') || 0;
  
  const target = document.getElementById('target');
  const board = document.getElementById('game-board');
  const scoreEl = document.getElementById('score');
  const timerEl = document.getElementById('timer');
  const hsEl = document.getElementById('highscore');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const foodLabel = document.getElementById('food-label');

  hsEl.innerText = highScore;

  function moveTarget() {
    const maxX = board.clientWidth - 70;
    const maxY = board.clientHeight - 70;
    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);
    
    // Pilih makanan acak
    currentFood = foods[Math.floor(Math.random() * foods.length)];
    target.innerText = currentFood.icon;
    foodLabel.innerText = currentFood.name;

    target.style.left = randomX + 'px';
    target.style.top = randomY + 'px';
  }

  function hitTarget() {
    score += currentFood.pts;
    scoreEl.innerText = score;
    moveTarget();
  }

  target.addEventListener('touchstart', (e) => {
    e.preventDefault();
    hitTarget();
  });
  target.addEventListener('click', hitTarget);

  function startGame() {
    score = 0;
    timeLeft = 20;
    scoreEl.innerText = score;
    timerEl.innerText = timeLeft + 's';
    
    overlay.style.display = 'none';
    target.style.display = 'block';
    foodLabel.style.display = 'block';
    startBtn.style.display = 'none';
    
    moveTarget();

    clearInterval(gameTimer);
    gameTimer = setInterval(() => {
      timeLeft--;
      timerEl.innerText = timeLeft + 's';

      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    clearInterval(gameTimer);
    target.style.display = 'none';
    foodLabel.style.display = 'none';
    overlay.style.display = 'flex';
    startBtn.style.display = 'block';
    startBtn.innerText = 'MAIN LAGI';

    if (score > highScore) {
      highScore = score;
      localStorage.setItem('seblak_tap_hs', highScore);
      hsEl.innerText = highScore;
      overlay.innerHTML = `<h2>🎉 JURAGAN KULINER!</h2><p>Rekor Baru! Skor: <b>${score}</b></p>`;
    } else {
      overlay.innerHTML = `<h2>WAKTU HABIS!</h2><p>Skor Kuliner Kamu: <b>${score}</b></p>`;
    }
  }
</script>

</body>
</html>
