<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Petualangan Ay & Kiki 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: 'Fredoka', sans-serif;
    background: #1e1b4b; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
  }
  .game-container {
    width: 100%; max-width: 480px; height: 100vh;
    background: linear-gradient(180deg, #0f172a 0%, #312e81 100%);
    position: relative; overflow: hidden; display: flex; flex-direction: column;
  }
  
  /* Screens */
  .screen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    text-align: center; z-index: 10; background: rgba(15, 23, 42, 0.95);
  }
  .screen.active { display: flex; }

  h1 { font-size: 28px; color: #fb7185; margin-bottom: 12px; text-shadow: 2px 2px 0px #881337; }
  p { font-size: 16px; color: #cbd5e1; margin-bottom: 24px; }

  .input-name {
    width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #6366f1;
    background: #1e1b4b; color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px;
    font-family: inherit; outline: none;
  }

  .btn {
    background: linear-gradient(b, #f43f5e, #e11d48); border: none;
    padding: 14px 24px; border-radius: 12px; color: white; font-weight: 700; font-size: 18px;
    cursor: pointer; width: 100%; box-shadow: 0 6px 0 #9f1239; transition: all 0.1s;
    font-family: inherit; margin-bottom: 12px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9f1239; }
  .btn-blue { background: linear-gradient(to bottom, #60a5fa, #3b82f6); box-shadow: 0 6px 0 #1d4ed8; }
  .btn-blue:active { box-shadow: 0 2px 0 #1d4ed8; }

  /* Game HUD */
  .hud {
    display: flex; justify-content: space-between; padding: 16px 24px;
    background: rgba(0,0,0,0.5); font-size: 20px; font-weight: 700; z-index: 5;
  }
  .lives { color: #f43f5e; }
  .timer { color: #fbbf24; }

  /* Battle Stage */
  .stage {
    flex: 1; display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; position: relative; background: url('https://www.transparenttextures.com/patterns/cubes.png');
  }
  .sprite { font-size: 60px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); transition: transform 0.3s; }
  .hero { animation: float 2s infinite ease-in-out; }
  .monster { animation: float 2s infinite ease-in-out reverse; }
  
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes attack { 0% { transform: translateX(0); } 50% { transform: translateX(30px); } 100% { transform: translateX(0); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-10deg); } 75% { transform: translateX(10px) rotate(10deg); } }

  /* Dialog & Options */
  .dialog-box {
    background: #f8fafc; color: #0f172a; padding: 16px; border-radius: 16px;
    margin: -20px 16px 16px 16px; font-weight: 600; font-size: 15px;
    border: 4px solid #cbd5e1; box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 5;
  }
  
  .options { padding: 0 16px 24px 16px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
  .opt-btn {
    background: #334155; color: white; border: 2px solid #475569; padding: 14px;
    border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; text-align: left;
    transition: background 0.2s; font-family: inherit; display: flex; align-items: center; gap: 10px;
  }
  .opt-btn:active { background: #475569; }

  /* Leaderboard */
  .leaderboard-list { width: 100%; max-height: 300px; overflow-y: auto; text-align: left; margin-bottom: 20px; }
  .lb-item {
    background: #1e293b; padding: 12px 16px; border-radius: 10px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;
  }
  .lb-rank { font-weight: bold; color: #fbbf24; width: 30px; }
  .lb-name { flex: 1; font-weight: 600; }
  .lb-stats { font-size: 13px; color: #94a3b8; text-align: right; }
</style>
</head>
<body>

<div class="game-container">
  
  <!-- START SCREEN -->
  <div id="start-screen" class="screen active">
    <h1>⚔️ Kuis Petualangan Ay</h1>
    <p>Bantu Ay mengalahkan monster dengan menjawab pertanyaan tentang Kiki!</p>
    <input type="text" id="playerName" class="input-name" placeholder="Siapa namamu? (Misal: Ay)" autocomplete="off">
    <button class="btn" onclick="startGame()">Mulai Petualangan!</button>
    <button class="btn btn-blue" onclick="showLeaderboard()">Lihat Leaderboard</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="screen" style="background: transparent; padding: 0; justify-content: flex-start;">
    <div class="hud">
      <div class="lives" id="livesDisplay">❤️❤️❤️</div>
      <div class="timer">⏳ <span id="timeDisplay">00:00</span></div>
    </div>
    
    <div class="stage">
      <div class="sprite hero" id="heroSprite">🧙‍♀️</div>
      <div class="sprite monster" id="monsterSprite">👹</div>
    </div>

    <div class="dialog-box" id="questionText">Monster menghadangmu!</div>
    
    <div class="options" id="optionsContainer">
      <!-- Pilihan jawaban akan dimuat di sini oleh JS -->
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="screen">
    <h1 id="resultTitle">Game Over!</h1>
    <p id="resultMsg">Nyawamu habis dimakan monster.</p>
    <div style="font-size: 40px; margin-bottom: 20px;" id="resultEmoji">💀</div>
    <button class="btn" onclick="goToStart()">Menu Utama</button>
    <button class="btn btn-blue" onclick="showLeaderboard()">Leaderboard</button>
  </div>

  <!-- LEADERBOARD SCREEN -->
  <div id="leaderboard-screen" class="screen">
    <h1>🏆 Leaderboard</h1>
    <p>Ranking petualang terbaik!</p>
    <div class="leaderboard-list" id="lbList">
      <!-- List dari JS -->
    </div>
    <button class="btn" onclick="goToStart()">Kembali</button>
  </div>

</div>

 <script>
  // --- DATABASE PERTANYAAN (Fakta Kiki & Ay) ---
  const questions = [
    {
      q: "Grrr! Siapa nama panggilan kesayangan pembuat game ini kalau dipanggil sama Ay?",
      opts: ["Mas Riski", "Kiki / Adek", "Fiko", "Kakak"],
      ans: 1, monster: "👹"
    },
    {
      q: "Aku monster jalanan! Ay kalau berangkat sekolah ke SMKN 1 Kendal biasanya naik apa?",
      opts: ["Sepeda Motor", "Jalan Kaki", "BRT", "Angkot"],
      ans: 2, monster: "🐉"
    },
    {
      q: "Tanggal berapa Ay (Wafina) ulang tahun hayo?!",
      opts: ["26 September 2011", "2 Februari 2011", "10 Oktober 2011", "26 Agustus 2011"],
      ans: 0, monster: "🧛‍♂️"
    },
    {
      q: "Hehe! Kiki biasanya bangun jam berapa pagi buat siap-siap sekolah?",
      opts: ["05:30 AM", "06:00 AM", "04:30 AM", "05:00 AM"],
      ans: 2, monster: "🧟‍♂️"
    },
    {
      q: "Pertanyaan terakhir! Ay kelas X BUS 1, kalau Kiki di SMKN 1 Kendal kelas jurusan apa?",
      opts: ["X TSM", "X TKJ", "X RPL", "X BUS 3"],
      ans: 3, monster: "🧙‍♂️" // Boss
    }
  ];

  // --- VARIABEL GAME ---
  let currentQ = 0;
  let lives = 3;
  let timerInterval;
  let seconds = 0;
  let playerName = "";

  // Elements
  const screens = document.querySelectorAll('.screen');
  const livesDisplay = document.getElementById('livesDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const qText = document.getElementById('questionText');
  const optsContainer = document.getElementById('optionsContainer');
  const heroSprite = document.getElementById('heroSprite');
  const monsterSprite = document.getElementById('monsterSprite');

  // --- FUNGSI NAVIGASI ---
  function switchScreen(id) {
    screens.forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function goToStart() {
    switchScreen('start-screen');
  }

  // --- FUNGSI GAMEPLAY ---
  function startGame() {
    const nameInput = document.getElementById('playerName').value.trim();
    playerName = nameInput === "" ? "Petualang Misterius" : nameInput;
    
    currentQ = 0;
    lives = 3;
    seconds = 0;
    updateLives();
    timeDisplay.innerText = "00:00";
    
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      timeDisplay.innerText = `${m}:${s}`;
    }, 1000);

    switchScreen('game-screen');
    loadQuestion();
  }

  function updateLives() {
    livesDisplay.innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
  }

  function loadQuestion() {
    const qData = questions[currentQ];
    qText.innerText = qData.q;
    monsterSprite.innerText = qData.monster;
    
    optsContainer.innerHTML = "";
    qData.opts.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span style="color:#fbbf24;">${['A','B','C','D'][index]}.</span> ${opt}`;
      btn.onclick = () => checkAnswer(index);
      optsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selectedIndex) {
    const correctIndex = questions[currentQ].ans;
    
    if (selectedIndex === correctIndex) {
      // Benar -> Animasi serang
      heroSprite.style.animation = "attack 0.5s";
      setTimeout(() => heroSprite.style.animation = "float 2s infinite ease-in-out", 500);
      
      currentQ++;
      if (currentQ >= questions.length) {
        setTimeout(winGame, 600);
      } else {
        setTimeout(loadQuestion, 600);
      }
    } else {
      // Salah -> Animasi gemetar (damage) & kurang nyawa
      monsterSprite.style.animation = "attack 0.5s reverse";
      heroSprite.style.animation = "shake 0.5s";
      setTimeout(() => {
        monsterSprite.style.animation = "float 2s infinite ease-in-out reverse";
        heroSprite.style.animation = "float 2s infinite ease-in-out";
      }, 500);
      
      lives--;
      updateLives();
      if (lives <= 0) {
        setTimeout(loseGame, 500);
      }
    }
  }

  // --- KONDISI SELESAI ---
  function winGame() {
    clearInterval(timerInterval);
    document.getElementById('resultTitle').innerText = "Kemenangan!";
    document.getElementById('resultTitle').style.color = "#34d399";
    document.getElementById('resultMsg').innerText = `Hebat Ay! Kamu menang dengan sisa ${lives} nyawa dalam waktu ${timeDisplay.innerText}.`;
    document.getElementById('resultEmoji').innerText = "🎉";
    
    saveScore();
    switchScreen('result-screen');
  }

  function loseGame() {
    clearInterval(timerInterval);
    document.getElementById('resultTitle').innerText = "Game Over!";
    document.getElementById('resultTitle').style.color = "#f43f5e";
    document.getElementById('resultMsg').innerText = "Yah, Ay kehabisan nyawa! Coba lagi ya.";
    document.getElementById('resultEmoji').innerText = "💀";
    
    switchScreen('result-screen');
  }

  // --- LEADERBOARD (Local Storage) ---
  function saveScore() {
    let lb = JSON.parse(localStorage.getItem('ayKikiLeaderboard')) || [];
    lb.push({ name: playerName, lives: lives, time: seconds, timeStr: timeDisplay.innerText });
    
    // Sort: Nyawa terbanyak (desc), Waktu tercepat (asc)
    lb.sort((a, b) => {
      if (b.lives !== a.lives) return b.lives - a.lives;
      return a.time - b.time;
    });
    
    // Simpan top 10
    lb = lb.slice(0, 10);
    localStorage.setItem('ayKikiLeaderboard', JSON.stringify(lb));
  }

  function showLeaderboard() {
    const lb = JSON.parse(localStorage.getItem('ayKikiLeaderboard')) || [];
    const lbList = document.getElementById('lbList');
    lbList.innerHTML = "";
    
    if (lb.length === 0) {
      lbList.innerHTML = "<p style='text-align:center;'>Belum ada petualang. Ayo main!</p>";
    } else {
      lb.forEach((entry, index) => {
        let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `#${index+1}`;
        lbList.innerHTML += `
          <div class="lb-item">
            <div class="lb-rank">${medal}</div>
            <div class="lb-name">${entry.name}</div>
            <div class="lb-stats">❤️ ${entry.lives} | ⏱️ ${entry.timeStr}</div>
          </div>
        `;
      });
    }
    switchScreen('leaderboard-screen');
  }
</script>
</body>
</html>
