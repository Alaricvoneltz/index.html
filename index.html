<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seblak vs Bocil - Tower Defense</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body, html {
    width: 100%; height: 100%;
    background: #090d16; color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  #game-container {
    position: relative; width: 100%; height: 100%;
    max-width: 480px; background: #111827;
    display: flex; flex-direction: column;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
  }

  /* Header Stat */
  .header {
    height: 50px; background: #1f2937; border-bottom: 2px solid #374151;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; z-index: 10;
  }
  .res-box { font-size: 16px; font-weight: 900; color: #ef4444; display: flex; align-items: center; gap: 6px; }
  .wave-box { font-size: 12px; color: #9ca3af; font-weight: 700; }

  /* Arena Canvas */
  #canvas-wrapper { flex: 1; position: relative; width: 100%; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* Selector Deck Unit (Bawah) */
  .deck-bar {
    height: 90px; background: #1f2937; border-top: 2px solid #374151;
    display: flex; justify-content: space-around; align-items: center;
    padding: 6px; z-index: 10;
  }
  .card-unit {
    width: 70px; height: 75px; background: #374151; border: 2px solid #4b5563;
    border-radius: 10px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; cursor: pointer; transition: 0.15s;
  }
  .card-unit.active { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); transform: scale(1.05); }
  .card-unit.disabled { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
  .card-icon { font-size: 24px; }
  .card-cost { font-size: 11px; font-weight: 900; color: #fca5a5; margin-top: 2px; }

  /* Overlay Screen */
  .overlay {
    position: absolute; inset: 0; background: rgba(17, 24, 39, 0.92);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 20; padding: 20px; text-align: center;
  }
  .overlay h1 { font-size: 26px; color: #ef4444; margin-bottom: 8px; font-weight: 900; }
  .overlay p { font-size: 13px; color: #9ca3af; margin-bottom: 20px; line-height: 1.5; }
  .btn-start {
    background: #ef4444; color: white; border: none; padding: 12px 30px;
    border-radius: 10px; font-size: 16px; font-weight: 900; cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- Top Bar -->
  <div class="header">
    <div class="res-box">🌶️ <span id="res-val">100</span></div>
    <div class="wave-box">WAVE <span id="wave-val">1</span></div>
  </div>

  <!-- Arena Game -->
  <div id="canvas-wrapper">
    <canvas id="canvas"></canvas>

    <!-- Overlay Start -->
    <div id="screen-start" class="overlay">
      <h1>SEBLAK VS BOCIL 🛡️</h1>
      <p>Pilih unit di deck bawah, lalu tap petak jalur untuk memasangnya.<br>Tahan serbuan Bocil dari gerobak seblak!</p>
      <button class="btn-start" onclick="startGame()">MULAI MAIN</button>
    </div>

    <!-- Overlay Game Over -->
    <div id="screen-gameover" class="overlay" style="display:none;">
      <h1>GEROBAK JEBOLL! 💥</h1>
      <p>Bocil berhasil menerobos pertahanan seblakmu.</p>
      <button class="btn-start" onclick="startGame()">COBA LAGI</button>
    </div>
  </div>

  <!-- Selection Cards -->
  <div class="deck-bar">
    <div class="card-unit" id="card-esteh" onclick="selectUnit('esteh')">
      <span class="card-icon">🧋</span>
      <span class="card-cost">🌶️ 50</span>
    </div>
    <div class="card-unit" id="card-cabai" onclick="selectUnit('cabai')">
      <span class="card-icon">🌶️</span>
      <span class="card-cost">🌶️ 100</span>
    </div>
    <div class="card-unit" id="card-semangka" onclick="selectUnit('semangka')">
      <span class="card-icon">🍉</span>
      <span class="card-cost">🌶️ 175</span>
    </div>
    <div class="card-unit" id="card-mangga" onclick="selectUnit('mangga')">
      <span class="card-icon">🥭</span>
      <span class="card-cost">🌶️ 50</span>
    </div>
  </div>
</div>

<script>
  /* ========================================================
     KONFIGURASI ASET GAMBAR (PNG TRANSPARAN)
     Saat gambar sudah ada, ganti null dengan link URL gambar:
     contoh: cabai: 'https://domain.com/cabai.png'
  ======================================================== */
  const ASSETS_URL = {
    esteh: null,
    cabai: null,
    semangka: null,
    mangga: null,
    bocil_sd: null,
    bocil_sepeda: null
  };

  // Preload Image Objects
  const IMAGES = {};
  for (let key in ASSETS_URL) {
    if (ASSETS_URL[key]) {
      IMAGES[key] = new Image();
      IMAGES[key].src = ASSETS_URL[key];
    }
  }

  // Canvas Setup
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('canvas-wrapper');

  const ROWS = 5;
  const COLS = 6;
  let cellW, cellH;

  function resize() {
    canvas.width = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
    cellW = canvas.width / COLS;
    cellH = canvas.height / ROWS;
  }
  resize();
  window.addEventListener('resize', resize);

  // Data Game State
  let isPlaying = false;
  let points = 100;
  let wave = 1;
  let selectedUnitType = null;
  let spawnTimer = 0;

  let grid = [];
  let towers = [];
  let enemies = [];
  let bullets = [];

  const UNIT_SPECS = {
    esteh:    { cost: 50,  hp: 80,  icon: '🧋', type: 'resource' },
    cabai:    { cost: 100, hp: 100, icon: '🌶️', type: 'shooter',  rate: 60, dmg: 20 },
    semangka: { cost: 175, hp: 120, icon: '🍉', type: 'splash',   rate: 90, dmg: 35 },
    mangga:   { cost: 50,  hp: 400, icon: '🥭', type: 'wall' }
  };

  // Touch / Click Input Grid
  canvas.addEventListener('pointerdown', (e) => {
    if (!isPlaying || !selectedUnitType) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const col = Math.floor(x / cellW);
    const row = Math.floor(y / cellH);

    if (col >= 0 && col < COLS - 1 && row >= 0 && row < ROWS) {
      placeTower(row, col);
    }
  });

  function selectUnit(type) {
    if (points < UNIT_SPECS[type].cost) return;
    selectedUnitType = type;
    document.querySelectorAll('.card-unit').forEach(el => el.classList.remove('active'));
    document.getElementById(`card-${type}`).classList.add('active');
  }

  function placeTower(row, col) {
    // Cek petak kosong
    const exist = towers.find(t => t.row === row && t.col === col);
    if (exist) return;

    const spec = UNIT_SPECS[selectedUnitType];
    if (points >= spec.cost) {
      points -= spec.cost;
      towers.push({
        row: row, col: col,
        x: col * cellW + cellW/2,
        y: row * cellH + cellH/2,
        hp: spec.hp, maxHp: spec.hp,
        type: selectedUnitType,
        timer: 0
      });
      selectedUnitType = null;
      document.querySelectorAll('.card-unit').forEach(el => el.classList.remove('active'));
      updateUI();
    }
  }

  function spawnEnemy() {
    const row = Math.floor(Math.random() * ROWS);
    const isFast = Math.random() > 0.7;
    enemies.push({
      row: row,
      x: canvas.width + 20,
      y: row * cellH + cellH/2,
      hp: isFast ? 70 : 150,
      maxHp: isFast ? 70 : 150,
      speed: isFast ? 1.4 : 0.7,
      type: isFast ? 'bocil_sepeda' : 'bocil_sd',
      icon: isFast ? '🏃' : '👦',
      eatTimer: 0
    });
  }

  function update() {
    if (!isPlaying) return;

    // Spawn Logic
    spawnTimer++;
    if (spawnTimer % Math.max(90, 220 - wave * 20) === 0) {
      spawnEnemy();
    }

    // Towers Logic
    towers.forEach(t => {
      t.timer++;
      const spec = UNIT_SPECS[t.type];

      if (spec.type === 'resource' && t.timer % 300 === 0) {
        points += 25; updateUI();
      }

      if (spec.type === 'shooter' && t.timer % spec.rate === 0) {
        // Cek jika ada musuh di jalurnya
        const hasEnemyInRow = enemies.some(e => e.row === t.row && e.x > t.x);
        if (hasEnemyInRow) {
          bullets.push({ x: t.x + 15, y: t.y, row: t.row, dmg: spec.dmg, icon: '🔴', speed: 6 });
        }
      }

      if (spec.type === 'splash' && t.timer % spec.rate === 0) {
        const hasEnemyInRow = enemies.some(e => e.row === t.row && e.x > t.x);
        if (hasEnemyInRow) {
          bullets.push({ x: t.x + 15, y: t.y, row: t.row, dmg: spec.dmg, icon: '🍉', speed: 4, splash: true });
        }
      }
    });

    // Bullets Logic
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.speed;

      for (let j = enemies.length - 1; j >= 0; j--) {
        let e = enemies[j];
        if (e.row === b.row && Math.abs(e.x - b.x) < 20) {
          e.hp -= b.dmg;
          if (b.splash) {
            // Splash ke musuh terdekat
            enemies.forEach(other => {
              if (other.row === b.row && Math.abs(other.x - e.x) < 50) other.hp -= 15;
            });
          }
          bullets.splice(i, 1);
          if (e.hp <= 0) enemies.splice(j, 1);
          break;
        }
      }
      if (b.x > canvas.width + 20) bullets.splice(i, 1);
    }

    // Enemies Logic
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      
      // Hitung tabrakan dengan Tower
      const blockingTower = towers.find(t => t.row === e.row && Math.abs(t.x - e.x) < 25);

      if (blockingTower) {
        e.eatTimer++;
        if (e.eatTimer % 30 === 0) {
          blockingTower.hp -= 15;
          if (blockingTower.hp <= 0) {
            towers = towers.filter(t => t !== blockingTower);
          }
        }
      } else {
        e.x -= e.speed;
      }

      // Kalah jika tembus ujung kiri
      if (e.x < 10) {
        gameOver();
        return;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Lines & Lanes
    for (let r = 0; r < ROWS; r++) {
      ctx.fillStyle = (r % 2 === 0) ? '#1f2937' : '#111827';
      ctx.fillRect(0, r * cellH, canvas.width, cellH);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.strokeRect(0, r * cellH, canvas.width, cellH);
    }
    for (let c = 0; c < COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * cellW, 0); ctx.lineTo(c * cellW, canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.stroke();
    }

    // Draw Towers
    towers.forEach(t => {
      if (IMAGES[t.type]) {
        ctx.drawImage(IMAGES[t.type], t.x - cellW/3, t.y - cellH/3, cellW*0.7, cellH*0.7);
      } else {
        ctx.font = `${cellH * 0.4}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(UNIT_SPECS[t.type].icon, t.x, t.y);
      }
      // Darah Tower
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(t.x - 15, t.y + 20, (t.hp / t.maxHp) * 30, 4);
    });

    // Draw Bullets
    bullets.forEach(b => {
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.icon, b.x, b.y);
    });

    // Draw Enemies
    enemies.forEach(e => {
      if (IMAGES[e.type]) {
        ctx.drawImage(IMAGES[e.type], e.x - cellW/3, e.y - cellH/3, cellW*0.7, cellH*0.7);
      } else {
        ctx.font = `${cellH * 0.45}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(e.icon, e.x, e.y);
      }
      // Darah Musuh
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(e.x - 15, e.y - 25, Math.max(0, (e.hp / e.maxHp)) * 30, 4);
    });
  }

  function loop() {
    update();
    draw();
    if (isPlaying) requestAnimationFrame(loop);
  }

  function updateUI() {
    document.getElementById('res-val').innerText = points;
    document.getElementById('wave-val').innerText = wave;

    // Disabled card jika poin kurang
    for (let key in UNIT_SPECS) {
      const card = document.getElementById(`card-${key}`);
      if (points < UNIT_SPECS[key].cost) card.classList.add('disabled');
      else card.classList.remove('disabled');
    }
  }

  function startGame() {
    points = 100; wave = 1; spawnTimer = 0;
    towers = []; enemies = []; bullets = [];
    document.getElementById('screen-start').style.display = 'none';
    document.getElementById('screen-gameover').style.display = 'none';
    updateUI();
    isPlaying = true;
    loop();
  }

  function gameOver() {
    isPlaying = false;
    document.getElementById('screen-gameover').style.display = 'flex';
  }
</script>
</body>
</html>
