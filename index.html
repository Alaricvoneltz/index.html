<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kiki's Arcade Hub 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #09090b; color: #f8fafc;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  
  .app-container {
    width: 100%; max-width: 600px; padding: 20px;
    display: flex; flex-direction: column; flex: 1; position: relative;
  }

  /* Header */
  .header { text-align: center; margin-bottom: 24px; margin-top: 12px; }
  .header h1 { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }

  /* Screens */
  .screen { display: none; flex-direction: column; width: 100%; animation: fadeIn 0.3s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Grid Menu Games */
  .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .game-card {
    background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px; padding: 20px 16px; text-align: center; cursor: pointer;
    transition: all 0.2s; backdrop-filter: blur(10px);
  }
  .game-card:active { transform: scale(0.95); }
  .game-card i { font-size: 32px; margin-bottom: 12px; display: block; }
  .game-card h3 { font-size: 15px; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
  
  /* Warna Ikon Game */
  .c-family { color: #f43f5e; }
  .c-sambung { color: #10b981; }
  .c-gambar { color: #f59e0b; }
  .c-kata { color: #8b5cf6; }
  .c-abc { color: #06b6d4; grid-column: span 2; } /* Lebar penuh */

  /* Game Interface */
  .game-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding: 16px; background: rgba(30, 41, 59, 0.8); border-radius: 16px; }
  .btn-back { background: transparent; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
  .game-title { font-weight: 700; font-size: 18px; color: #fff; }

  /* Game Content Area */
  .game-content { flex: 1; background: rgba(15, 23, 42, 0.6); border-radius: 20px; padding: 24px; border: 1px dashed rgba(148, 163, 184, 0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 300px; }
  
  .category-select { width: 100%; padding: 14px; border-radius: 12px; background: #1e293b; color: #fff; border: 1px solid #475569; font-family: inherit; font-size: 15px; margin-bottom: 16px; outline: none; }
  
  .play-btn { background: linear-gradient(135deg, #38bdf8, #2563eb); color: white; border: none; padding: 14px 24px; border-radius: 14px; font-weight: 700; width: 100%; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); margin-bottom: 12px; }
  
  .loader { display: none; font-size: 14px; color: #fbbf24; margin-top: 10px; }
  
  /* Input & Log UI */
  .game-prompt { font-size: 20px; font-weight: 800; margin-bottom: 16px; color: #f43f5e; }
  .game-input { width: 100%; padding: 14px; border-radius: 12px; background: #0f172a; border: 2px solid #334155; color: #fff; text-align: center; font-size: 16px; outline: none; font-weight: 600; margin-bottom: 12px; }
  .game-input:focus { border-color: #38bdf8; }
  .result-log { font-size: 14px; font-weight: 600; min-height: 20px; }
  .res-success { color: #10b981; }
  .res-error { color: #f43f5e; }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- Menu Screen -->
  <div id="menu-screen" class="screen active">
    <div class="header">
      <h1>Arcade Hub</h1>
      <p>Data Source: github.com/Alaricvoneltz</p>
    </div>

    <div class="game-grid">
      <div class="game-card" onclick="openGame('family100', 'Family 100')">
        <i class="fa-solid fa-users c-family"></i>
        <h3>Family 100</h3>
      </div>
      <div class="game-card" onclick="openGame('sambungkata', 'Sambung Kata')">
        <i class="fa-solid fa-link c-sambung"></i>
        <h3>Sambung Kata</h3>
      </div>
      <div class="game-card" onclick="openGame('tebakgambar', 'Tebak Gambar')">
        <i class="fa-solid fa-image c-gambar"></i>
        <h3>Tebak Gambar</h3>
      </div>
      <div class="game-card" onclick="openGame('tebakkata', 'Tebak Kata')">
        <i class="fa-solid fa-spell-check c-kata"></i>
        <h3>Tebak Kata</h3>
      </div>
      <div class="game-card c-abc" onclick="openGame('abc5dasar', 'ABC 5 Dasar')">
        <i class="fa-solid fa-hand-sparkles c-abc"></i>
        <h3>ABC 5 Dasar</h3>
      </div>
    </div>
  </div>

  <!-- Game Player Screen -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <button class="btn-back" onclick="backToMenu()"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="game-title" id="activeGameTitle">Game Title</div>
      <div style="width: 20px;"></div> <!-- Spacer -->
    </div>

    <div class="game-content" id="gameEngine">
      <!-- Konten game akan dirender otomatis oleh JS di sini -->
    </div>
  </div>

</div>

 <script>
  // Database URL dari GitHub Kiki (Sudah disesuaikan ke raw format)
  const DB = {
    family100: "https://raw.githubusercontent.com/Alaricvoneltz/Game/refs/heads/Family100Raw/Family100Raw",
    sambungkata: "https://raw.githubusercontent.com/Alaricvoneltz/Game/refs/heads/Family100Raw/SambungKataRaw",
    tebakgambar: "https://raw.githubusercontent.com/Alaricvoneltz/Game/refs/heads/Family100Raw/TebakGambarRaw",
    tebakkata: "https://raw.githubusercontent.com/Alaricvoneltz/Game/refs/heads/Family100Raw/TebakKataRaw",
    abc5dasar: {
      Benda: "https://raw.githubusercontent.com/Alaricvoneltz/ABC-5-dasar/refs/heads/main/Benda.md",
      Buah: "https://raw.githubusercontent.com/Alaricvoneltz/ABC-5-dasar/refs/heads/main/Buah.md",
      Hewan: "https://raw.githubusercontent.com/Alaricvoneltz/ABC-5-dasar/main/Hewan.md",
      Makanan: "https://raw.githubusercontent.com/Alaricvoneltz/ABC-5-dasar/refs/heads/main/Makanan.md",
      Negara: "https://raw.githubusercontent.com/Alaricvoneltz/ABC-5-dasar/refs/heads/main/Negara.md",
      Pekerjaan: "https://raw.githubusercontent.com/Alaricvoneltz/ABC-5-dasar/refs/heads/main/Pekerjaan.md"
    }
  };

  // State
  let currentGameId = "";
  let loadedData = null;
  let activeLetter = "";

  // Elements
  const menuScreen = document.getElementById('menu-screen');
  const gameScreen = document.getElementById('game-screen');
  const gameTitle = document.getElementById('activeGameTitle');
  const engine = document.getElementById('gameEngine');

  function backToMenu() {
    gameScreen.classList.remove('active');
    menuScreen.classList.add('active');
    engine.innerHTML = ""; // Bersihkan mesin
  }

  function openGame(gameId, title) {
    currentGameId = gameId;
    gameTitle.innerText = title;
    menuScreen.classList.remove('active');
    gameScreen.classList.add('active');
    
    if (gameId === 'abc5dasar') {
      renderABCUI();
    } else {
      renderGenericGameUI(gameId);
    }
  }

  // ============================================
  // MESIN GAME: ABC 5 DASAR
  // ============================================
  function renderABCUI() {
    engine.innerHTML = `
      <p style="color:#94a3b8; margin-bottom:12px; font-size:13px;">Pilih kategori dari database GitHub:</p>
      <select id="abcCategory" class="category-select">
        <option value="Benda">Benda</option>
        <option value="Buah">Buah</option>
        <option value="Hewan">Hewan</option>
        <option value="Makanan">Makanan</option>
        <option value="Negara">Negara</option>
        <option value="Pekerjaan">Pekerjaan</option>
      </select>
      <button class="play-btn" onclick="startABC()"><i class="fa-solid fa-play"></i> Mulai Main</button>
      <div id="loader" class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke GitHub...</div>
      <div id="abcPlayArea" style="width:100%; display:none; margin-top:20px;">
        <div class="game-prompt">Huruf: <span id="abcLetter" style="font-size:36px; color:#38bdf8;">A</span></div>
        <p style="font-size:13px; color:#94a3b8; margin-bottom:12px;" id="abcDesc"></p>
        <input type="text" id="abcInput" class="game-input" placeholder="Ketik jawabanmu..." autocomplete="off">
        <button class="play-btn" onclick="checkABCAnswer()">Jawab!</button>
        <div id="abcLog" class="result-log"></div>
      </div>
    `;
  }

  async function startABC() {
    const category = document.getElementById('abcCategory').value;
    const url = DB.abc5dasar[category];
    const loader = document.getElementById('loader');
    const playArea = document.getElementById('abcPlayArea');
    
    loader.style.display = 'block';
    playArea.style.display = 'none';

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Gagal mengambil data");
      const textData = await response.text();
      
      // Bersihkan format Markdown (hapus -, *, spasi) dan jadikan array huruf kecil
      loadedData = textData.split('\n')
        .map(line => line.replace(/^[\-\*\#]\s*/, '').trim().toLowerCase())
        .filter(line => line.length > 0);

      // Generate huruf acak dari A-Z
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      activeLetter = alphabet[Math.floor(Math.random() * alphabet.length)];
      
      document.getElementById('abcLetter').innerText = activeLetter;
      document.getElementById('abcDesc').innerText = `Sebutkan nama ${category} yang berawalan huruf ${activeLetter}`;
      document.getElementById('abcInput').value = "";
      document.getElementById('abcLog').innerText = "";
      
      loader.style.display = 'none';
      playArea.style.display = 'block';

    } catch (err) {
      loader.innerHTML = `<span class="res-error">Gagal memuat database dari GitHub.</span>`;
    }
  }

  function checkABCAnswer() {
    const answer = document.getElementById('abcInput').value.trim().toLowerCase();
    const log = document.getElementById('abcLog');
    
    if (!answer) return;

    if (!answer.startsWith(activeLetter.toLowerCase())) {
      log.className = "result-log res-error";
      log.innerText = `Jawaban harus berawalan huruf ${activeLetter}!`;
      return;
    }

    if (loadedData.includes(answer)) {
      log.className = "result-log res-success";
      log.innerHTML = `<i class="fa-solid fa-check-circle"></i> Betul! "${answer}" ada di database.`;
      // Otomatis ganti huruf setelah 2 detik
      setTimeout(startABC, 2000);
    } else {
      log.className = "result-log res-error";
      log.innerHTML = `<i class="fa-solid fa-xmark-circle"></i> Salah! "${answer}" tidak ditemukan di database GitHub.`;
    }
  }

  // ============================================
  // MESIN GAME: TRIVIA GENERIC (Family 100, Tebak Kata, dll)
  // ============================================
  function renderGenericGameUI(gameId) {
    engine.innerHTML = `
      <p style="color:#94a3b8; font-size:14px; margin-bottom:16px;">
        Membaca format raw dari <b>${gameId}Raw</b>...
      </p>
      <button class="play-btn" onclick="fetchGenericData('${gameId}')"><i class="fa-solid fa-cloud-arrow-down"></i> Tarik Data Game</button>
      <div id="loader" class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke GitHub...</div>
      
      <!-- Area Render Data -->
      <div id="genericDataBox" style="margin-top:20px; width:100%; text-align:left; background:#0f172a; padding:12px; border-radius:12px; font-family:monospace; font-size:12px; color:#10b981; display:none; max-height:200px; overflow-y:auto; border:1px solid #334155;">
      </div>
    `;
  }

  async function fetchGenericData(gameId) {
    const url = DB[gameId];
    const loader = document.getElementById('loader');
    const dataBox = document.getElementById('genericDataBox');
    
    loader.style.display = 'block';
    dataBox.style.display = 'none';

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error("Gagal");
      const textData = await response.text();
      
      loader.style.display = 'none';
      dataBox.style.display = 'block';
      dataBox.innerText = textData; // Menampilkan mentahan data JSON/Text dari repo

    } catch (err) {
      loader.innerHTML = `<span class="res-error">Gagal membaca URL GitHub Raw.</span>`;
    }
  }
</script>
</body>
</html>
